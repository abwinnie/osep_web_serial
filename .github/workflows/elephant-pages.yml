name: 部署大象牙膏模擬
on:
  push:
    branches: [master]
    paths:
      [
        "elephant-toothpaste/**",
        "app/**",
        ".github/workflows/elephant-pages.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: elephant-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elephant-toothpaste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: elephant-toothpaste/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: 保留既有靜態網站並加入模擬子目錄
        run: |
          mkdir -p ../pages-site/elephant-toothpaste
          cp -R ../app/. ../pages-site/
          cp -R dist/. ../pages-site/elephant-toothpaste/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發布
        id: deployment
        uses: actions/deploy-pages@v4
